name: Seiten zum Teilen

on:
  schedule:
    # Kurz nach Mitternacht (Winter- und Sommerzeit) und morgens noch einmal als Ausfallschutz
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths: [tools/build_share.py, .github/workflows/share-pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: share-pages

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: fonts-noto-core fonts-roboto-unhinted
          version: 1
      - run: pip install -q requests Pillow
      - name: Seiten erzeugen
        run: python tools/build_share.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wort zitat sitemap.xml
          git diff --cached --quiet || (git commit -qm "Seiten zum Teilen aktualisieren" && git push -q)
